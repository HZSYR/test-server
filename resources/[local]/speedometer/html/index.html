<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Speedometer</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; overflow: hidden; font-family: 'Rajdhani', sans-serif; }
        
        .hud {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: none;
        }
        .hud.show { display: flex; gap: 10px; align-items: flex-end; }
        
        .speedo-main {
            width: 180px;
            height: 180px;
            position: relative;
            background: radial-gradient(circle at 50% 50%, rgba(20,20,25,0.95) 0%, rgba(10,10,15,0.98) 100%);
            border-radius: 50%;
            border: 4px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.5);
        }
        
        .speedo-ring {
            position: absolute;
            top: 8px; left: 8px;
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 2px solid #333;
        }
        
        .speed-marks {
            position: absolute;
            width: 100%; height: 100%;
        }
        
        .mark {
            position: absolute;
            width: 2px;
            height: 10px;
            background: #555;
            left: 50%;
            top: 12px;
            transform-origin: 50% 78px;
        }
        .mark.major { height: 15px; width: 3px; background: #888; }
        .mark.red { background: #ff4444; }
        
        .mark-label {
            position: absolute;
            font-size: 11px;
            font-weight: 600;
            color: #777;
        }
        
        .needle-container {
            position: absolute;
            width: 100%; height: 100%;
        }
        
        .needle {
            position: absolute;
            left: 50%;
            bottom: 50%;
            width: 3px;
            height: 65px;
            background: linear-gradient(to top, #ff2200 0%, #ff4444 50%, #ff6666 100%);
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-135deg);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255,50,0,0.6);
            transition: transform 0.1s ease-out;
        }
        
        .needle-cap {
            position: absolute;
            left: 50%; top: 50%;
            width: 20px; height: 20px;
            background: radial-gradient(circle, #444 0%, #222 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #555;
            z-index: 10;
        }
        
        .digital {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        
        .speed-val {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .speed-unit {
            font-size: 11px;
            color: #666;
            letter-spacing: 2px;
        }
        
        .gear-display {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0,255,136,0.5);
        }
        .gear-display.reverse { color: #ff4444; text-shadow: 0 0 8px rgba(255,68,68,0.5); }
        
        .info-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: rgba(15,15,20,0.9);
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-icon {
            width: 20px;
            text-align: center;
            font-size: 12px;
        }
        
        .info-bar {
            width: 60px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .info-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.2s ease;
        }
        
        .info-fill.health { background: linear-gradient(90deg, #ff4444, #00ff88); }
        .info-fill.fuel { background: linear-gradient(90deg, #ff4444, #00aaff); }
        .info-fill.rpm { background: linear-gradient(90deg, #00ff88, #ffaa00, #ff4444); }
        
        .info-val {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            min-width: 30px;
        }
    </style>
</head>
<body>
    <div class="hud" id="hud">
        <div class="info-panel">
            <div class="info-row">
                <span class="info-icon">🔧</span>
                <div class="info-bar"><div class="info-fill health" id="healthBar"></div></div>
                <span class="info-val" id="health">100</span>
            </div>
            <div class="info-row">
                <span class="info-icon">⛽</span>
                <div class="info-bar"><div class="info-fill fuel" id="fuelBar"></div></div>
                <span class="info-val" id="fuel">100</span>
            </div>
            <div class="info-row">
                <span class="info-icon">⚡</span>
                <div class="info-bar"><div class="info-fill rpm" id="rpmBar"></div></div>
                <span class="info-val" id="rpm">0</span>
            </div>
        </div>
        
        <div class="speedo-main">
            <div class="speedo-ring"></div>
            
            <div class="speed-marks" id="marks"></div>
            
            <div class="gear-display" id="gear">N</div>
            
            <div class="needle-container">
                <div class="needle" id="needle"></div>
                <div class="needle-cap"></div>
            </div>
            
            <div class="digital">
                <div class="speed-val" id="speed">0</div>
                <div class="speed-unit">KM/H</div>
            </div>
        </div>
    </div>

    <script>
        const marksContainer = document.getElementById('marks');
        const maxSpeed = 260;
        
        for (let i = 0; i <= 26; i++) {
            const angle = -135 + (i * 10.38);
            const mark = document.createElement('div');
            mark.className = 'mark' + (i % 2 === 0 ? ' major' : '') + (i >= 22 ? ' red' : '');
            mark.style.transform = `translateX(-50%) rotate(${angle}deg)`;
            marksContainer.appendChild(mark);
        }
        
        const labels = [
            { val: 0, angle: -135 }, { val: 40, angle: -95 }, { val: 80, angle: -55 },
            { val: 120, angle: -15 }, { val: 160, angle: 25 }, { val: 200, angle: 65 },
            { val: 240, angle: 105 }
        ];
        
        labels.forEach(l => {
            const label = document.createElement('div');
            label.className = 'mark-label';
            label.textContent = l.val;
            const rad = (l.angle - 90) * Math.PI / 180;
            const x = 90 + 58 * Math.cos(rad);
            const y = 90 + 58 * Math.sin(rad);
            label.style.left = x + 'px';
            label.style.top = y + 'px';
            label.style.transform = 'translate(-50%, -50%)';
            marksContainer.appendChild(label);
        });

        const hud = document.getElementById('hud');
        const speedEl = document.getElementById('speed');
        const gearEl = document.getElementById('gear');
        const needle = document.getElementById('needle');
        const healthEl = document.getElementById('health');
        const healthBar = document.getElementById('healthBar');
        const fuelEl = document.getElementById('fuel');
        const fuelBar = document.getElementById('fuelBar');
        const rpmEl = document.getElementById('rpm');
        const rpmBar = document.getElementById('rpmBar');

        window.addEventListener('message', function(event) {
            const d = event.data;
            
            if (d.action === 'show') hud.classList.add('show');
            if (d.action === 'hide') hud.classList.remove('show');
            
            if (d.action === 'update') {
                speedEl.textContent = d.speed;
                
                const speedPercent = Math.min(d.speed / maxSpeed, 1);
                const rotation = -135 + (speedPercent * 270);
                needle.style.transform = `translateX(-50%) rotate(${rotation}deg)`;
                
                if (d.gear === 0) {
                    gearEl.textContent = 'R';
                    gearEl.className = 'gear-display reverse';
                } else {
                    gearEl.textContent = d.gear;
                    gearEl.className = 'gear-display';
                }
                
                healthEl.textContent = d.health;
                healthBar.style.width = d.health + '%';
                
                fuelEl.textContent = d.fuel;
                fuelBar.style.width = d.fuel + '%';
                
                const rpmPercent = Math.floor(d.rpm * 100);
                rpmEl.textContent = rpmPercent;
                rpmBar.style.width = rpmPercent + '%';
                
                if (d.speed > 200) {
                    speedEl.style.color = '#ff4444';
                } else if (d.speed > 140) {
                    speedEl.style.color = '#ffaa00';
                } else {
                    speedEl.style.color = '#fff';
                }
            }
        });
    </script>
</body>
</html>
